<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#e9efeb" />
    <meta
      name="description"
      content="把群里的难鱼接回家。和这个嘴硬心软的小家伙聊天、做饭、出门，收集你们的日常。"
    />
    <title>我的群友难鱼 · 今天也一起摸鱼</title>
    <link rel="icon" href="./assets/avatar.png" />
    <style>html,body{margin:0;width:100%;height:100%;background:#f7f9f0}#root{min-height:100%}</style>
    <script type="module" crossorigin src="./assets/index-DchHBJjj.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/icons-D5LGkxT0.js">
    <link rel="modulepreload" crossorigin href="./assets/react-gUqr1j9N.js">
    <link rel="stylesheet" crossorigin href="./assets/index-CMywmS5j.css">
  </head>
  <body>
    <div id="root">
      <section class="resource-loading" aria-label="我的群友难鱼，游戏加载中" aria-busy="true">
        <div class="resource-loading__paper" aria-hidden="true"></div>
        <div class="resource-loading__content">
          <p class="resource-loading__eyebrow">我的群友难鱼 <span>·</span> 小镇正在开门</p>
          <div class="resource-loading__performance" aria-hidden="true">
            <span class="resource-loading__words">难鱼的</span>
            <div class="resource-loading__burst">
              <span class="resource-loading__horse">🐴</span>
              <span class="resource-loading__ring"></span><span class="resource-loading__flash"></span>
              <i class="resource-loading__debris" style="--debris-x:85px;--debris-y:0px;--debris-turn:110deg;--debris-color:#7ea984;--debris-size:8px"></i>
              <i class="resource-loading__debris" style="--debris-x:70px;--debris-y:70px;--debris-turn:-160deg;--debris-color:#d0ad78;--debris-size:6px"></i>
              <i class="resource-loading__debris" style="--debris-x:0px;--debris-y:90px;--debris-turn:140deg;--debris-color:#426c55;--debris-size:8px"></i>
              <i class="resource-loading__debris" style="--debris-x:-70px;--debris-y:70px;--debris-turn:-130deg;--debris-color:#dfba9e;--debris-size:9px"></i>
              <i class="resource-loading__debris" style="--debris-x:-90px;--debris-y:0px;--debris-turn:160deg;--debris-color:#7ea984;--debris-size:7px"></i>
              <i class="resource-loading__debris" style="--debris-x:-70px;--debris-y:-70px;--debris-turn:-100deg;--debris-color:#d0ad78;--debris-size:8px"></i>
              <i class="resource-loading__debris" style="--debris-x:0px;--debris-y:-90px;--debris-turn:190deg;--debris-color:#426c55;--debris-size:6px"></i>
              <i class="resource-loading__debris" style="--debris-x:70px;--debris-y:-70px;--debris-turn:-140deg;--debris-color:#dfba9e;--debris-size:7px"></i>
              <span class="resource-loading__poof">嘭！</span>
            </div>
          </div>
          <p class="resource-loading__aside">先别急，正在把世界装进口袋。</p>
          <div class="resource-loading__progress">
            <div class="resource-loading__progress-heading"><span>正在打开游戏</span><strong>0<small>%</small></strong></div>
            <div class="resource-loading__track" role="progressbar" aria-label="游戏素材加载进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="resource-loading__fill"></div></div>
          </div>
          <p class="resource-loading__status">难鱼马上就来。</p>
          <noscript>需要开启 JavaScript 才能进入小镇。</noscript>
        </div>
      </section>
    </div>
  </body>
</html>
